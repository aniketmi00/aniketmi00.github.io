<div class="wave-banner" id="wave-banner" aria-hidden="true"></div>

<script>
  (function () {
    var root = document.getElementById("wave-banner");
    if (!root) return;

    var reduced = window.matchMedia("(prefers-reduced-motion: reduce)");
    var cells = [];              // flat list of spans
    var coords = [];             // matching [u, v] per cell, precomputed
    var cols = 0, rows = 0;
    var running = false, onScreen = true, rafId = null, startedAt = 0, lastDraw = 0;

    // Read the cell metrics from CSS so the two stay in sync.
    function metric(name, fallback) {
      var raw = getComputedStyle(root).getPropertyValue(name).trim();
      var n = parseFloat(raw);
      return isNaN(n) ? fallback : n;
    }

    function build() {
      var w = root.clientWidth, h = root.clientHeight;
      if (!w || !h) return false;

      var cw = metric("--cell-w", 9),
          ch = metric("--cell-h", 22),
          gap = metric("--cell-gap", 3);

      var nextCols = Math.max(1, Math.floor((w + gap) / (cw + gap)));
      var nextRows = Math.max(1, Math.floor((h + gap) / (ch + gap)));
      if (nextCols === cols && nextRows === rows && cells.length) return true;

      cols = nextCols;
      rows = nextRows;
      root.style.gridTemplateColumns = "repeat(" + cols + ", " + cw + "px)";

      // Build once into a fragment rather than appending cell by cell.
      var frag = document.createDocumentFragment();
      cells = new Array(cols * rows);
      coords = new Array(cols * rows);

      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          var i = r * cols + c;
          var span = document.createElement("span");
          span.className = "wave-cell";
          cells[i] = span;
          coords[i] = [
            cols === 1 ? 0.5 : c / (cols - 1),
            rows === 1 ? 0.5 : r / (rows - 1)
          ];
          frag.appendChild(span);
        }
      }
      root.textContent = "";
      root.appendChild(frag);
      return true;
    }

    // Dim field with two undulating ridges travelling across it.
    function value(u, v, t) {
      var ridge = 0.44 + 0.17 * Math.sin(u * 5.6 + t * 0.75)
                       + 0.09 * Math.sin(u * 11.3 - t * 1.25);
      var d = v - ridge;
      var glow = Math.exp(-(d * d) / 0.007) * (0.55 + 0.45 * Math.sin(u * 4.7 - t * 1.05));

      var d2 = v - (0.62 + 0.13 * Math.sin(u * 4.1 - t * 0.55 + 2.1));
      var glow2 = Math.exp(-(d2 * d2) / 0.004) * 0.45
                * (0.5 + 0.5 * Math.sin(u * 7.9 + t * 0.9));

      var shimmer = 0.08 + 0.05 * Math.sin(u * 18.0 + v * 9.0 + t * 1.6);
      var b = shimmer + glow * 0.85 + glow2;
      return b < 0 ? 0 : b > 1 ? 1 : b;
    }

    function paint(t) {
      for (var i = 0; i < cells.length; i++) {
        var p = coords[i];
        cells[i].style.setProperty("--v", value(p[0], p[1], t).toFixed(3));
      }
    }

    // ~30fps is plenty for a slow wave and halves the style-recalc cost of
    // writing a custom property on every cell.
    var FRAME_MS = 33;

    function frame(now) {
      if (!startedAt) startedAt = now;
      if (now - lastDraw >= FRAME_MS) {
        lastDraw = now;
        paint((now - startedAt) / 1000);
      }
      rafId = requestAnimationFrame(frame);
    }

    function start() {
      if (running || reduced.matches || !onScreen || document.hidden) return;
      running = true;
      rafId = requestAnimationFrame(frame);
    }

    function stop() {
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
    }

    function reset() {
      stop();
      if (!build()) return;
      if (reduced.matches) paint(0);
      else start();
    }

    if ("IntersectionObserver" in window) {
      new IntersectionObserver(function (entries) {
        onScreen = entries[0].isIntersecting;
        onScreen ? start() : stop();
      }, { threshold: 0 }).observe(root);
    }

    document.addEventListener("visibilitychange", function () {
      document.hidden ? stop() : start();
    });

    var resizeTimer;
    window.addEventListener("resize", function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(reset, 150);
    });

    if (reduced.addEventListener) reduced.addEventListener("change", reset);
    reset();
  })();
</script>
