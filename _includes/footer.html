<div class="footer-inner">
  <time id="footer-time" class="footer-time" datetime=""></time>
</div>
<script>
  (function () {
    var el = document.getElementById("footer-time");
    if (!el) return;
    var tz = {{ site.timezone | default: "Asia/Kolkata" | jsonify }};
    var tzLabel = {{ site.timezone_label | default: "" | jsonify }};
    function zoneName(now) {
      if (tzLabel) return tzLabel;
      return new Intl.DateTimeFormat("en-US", {
        timeZone: tz,
        timeZoneName: "shortGeneric",
      }).formatToParts(now).find(function (p) { return p.type === "timeZoneName"; }).value;
    }
    function format(now) {
      var parts = new Intl.DateTimeFormat("en-US", {
        timeZone: tz,
        weekday: "short",
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit",
        hour12: true,
      }).formatToParts(now);
      var get = function (type) {
        return (parts.find(function (p) { return p.type === type; }) || {}).value || "";
      };
      return get("weekday") + ", " + get("month") + " " + get("day") + ", " + get("year")
        + " " + get("hour") + ":" + get("minute") + " " + get("dayPeriod") + " " + zoneName(now);
    }
    function tick() {
      var now = new Date();
      el.textContent = format(now);
      el.setAttribute("datetime", now.toISOString());
    }
    tick();
    setInterval(tick, 1000);
  })();
</script>
