<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="glassBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3BE07C"/>
      <stop offset="0.55" stop-color="#1FB157"/>
      <stop offset="1" stop-color="#0C7A3C"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soften" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.7"/>
    </filter>
    <filter id="softenSm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
    <clipPath id="badgeClip">
      <rect width="32" height="32" rx="8"/>
    </clipPath>
  </defs>

  <rect width="32" height="32" rx="8" fill="url(#glassBg)"/>

  <g clip-path="url(#badgeClip)">
    <ellipse cx="10" cy="4" rx="16" ry="9" fill="#ffffff" opacity="0.4" filter="url(#soften)"/>
    <ellipse cx="26" cy="29" rx="14" ry="9" fill="#04431F" opacity="0.35" filter="url(#soften)"/>
  </g>

  <rect x="0.6" y="0.6" width="30.8" height="30.8" rx="7.4" fill="none" stroke="url(#rim)" stroke-width="1.1"/>

