<div class="mac-stage">
  <div class="mac">
    <div class="mac-case">
      <div class="mac-bezel">
        <div class="mac-crt">
          <div class="mac-screen">
            <pre class="mac-text"><span class="mac-out" id="mac-out"></span><span class="mac-cursor"></span></pre>
          </div>
          <div class="mac-glare"></div>
          <div class="mac-scanlines"></div>
        </div>
      </div>
      <div class="mac-lower">
        <div class="mac-badge">aniket</div>
        <div class="mac-drive"></div>
      </div>
    </div>
    <div class="mac-foot"></div>
  </div>
  <div class="mac-caption">// model inference systems, one note at a time</div>
</div>

<script>
  (function () {
    var out = document.getElementById('mac-out');
    if (!out) return;

    var lines = [
      'hello. i build inference systems.',
      'gpus go brrr, latency goes down.',
      'notes on ml, systems, and reading.',
      'scroll for the archive.'
    ];

    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      out.textContent = lines[0];
      return;
    }

    var line = 0, chars = 0, erasing = false;

    function tick() {
      var text = lines[line];
      var delay;

      if (!erasing) {
        chars += 1;
        out.textContent = text.slice(0, chars);
        delay = 55;
        if (chars === text.length) {
          erasing = true;
          delay = 2200;
        }
      } else {
        chars -= 1;
        out.textContent = text.slice(0, chars);
        delay = 25;
        if (chars === 0) {
          erasing = false;
          line = (line + 1) % lines.length;
          delay = 400;
        }
      }

      setTimeout(tick, delay);
    }

    tick();
  })();
</script>
