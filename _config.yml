title:               Aniket Mishrikotkar
github:              aniketmi00
linkedin:            aniketmish   # linkedin.com/in/<handle>
include:             ['_pages']
timezone:            Asia/Kolkata   # IANA zone for footer clock
timezone_label:      IST            # short label shown after time (e.g. PT, IST)
image:               /assets/og-default.png   # fallback social card when a page sets no page.image

exclude:             ['_includes/notes_graph.json', 'README.md', 'LICENSE', 'netlify.toml']
# For a user site (repo named aniketmi.github.io) keep baseurl empty.
# For a project site (repo named something else) set: baseurl: '/reponame'
baseurl:             ''
url:                 'https://aniketmi00.github.io'

# If you are using a host that cannot resolve URLs that do
# not end with .html (such as Neocities), set this to 'true'.
use_html_extension:  false

# Set to `true` to open non-internal links in new tabs, or
# set to `false` to open non-internal links in current tab.
open_external_links_in_new_tab: true

# Set to `true` to replace tweet URLs with Twitter embeds.
# Note that doing so will negatively the reader's privacy
# as their browser will communicate with Twitter's servers.
embed_tweets: false

permalink:           pretty
relative_permalinks: false

plugins:
  - jekyll-last-modified-at
  - jekyll-sitemap
  - jekyll-feed

# jekyll-feed only feeds site.posts by default; this site's writing lives
# in the "notes" collection, so point it there instead.
feed:
  collections:
    notes:
      path: "feed/notes.xml"

sass:
  sass_dir:          _sass
  style:            :compressed

collections:
  notes:
    output: true
    permalink: /:slug

defaults:
  - scope:
      path: "**/*"
    values:
      layout: "default"
  - scope:
      path: "_notes/**/*.md"
    values:
      layout: "note"
